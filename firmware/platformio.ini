; ============================================================
; platformio.ini — Smart Insole (ESP32)
; ============================================================

; ------------------------------------------------------------
; Environment: ESP32 hardware (flash & run di device)
; ------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=c++17
    -O2                          ; optimization: faster + smaller
    -ffunction-sections          ; GC unused functions
    -fdata-sections              ; GC unused data
    -Wl,--gc-sections            ; linker: remove unused code

lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14

; ------------------------------------------------------------
; Environment: Native test (unit test tanpa hardware)
; Run: pio test -e native
; ------------------------------------------------------------
; test_build_src=true so RandomForest.cpp (in src/) links into the test
; binary — without it the tests fail at link with undefined
; RandomForest::predict. build_src_filter then drops main.cpp, which
; needs Arduino.h and has no place on the host.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<RandomForest.cpp> -<main.cpp>
build_flags =
    -std=c++17
    -g                           ; debug symbols
