; ============================================================
; platformio.ini — Smart Insole (ESP32)
; ============================================================

; Target default. Tanpa baris ini `pio run` membangun SEMUA environment,
; termasuk `native` yang memang tidak punya main() (dipakai hanya lewat
; `pio test -e native`), sehingga link gagal dan upload terlihat rusak
; padahal board-nya baik-baik saja.
[platformio]
default_envs = esp32dev

; ------------------------------------------------------------
; Environment: ESP32 hardware (flash & run di device)
; ------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 gagal di kabel/board ini ("Unable to verify flash chip connection"
; setelah pindah baud). 460800 masih cepat dan jauh lebih toleran.
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=c++17
    -O2                          ; optimization: faster + smaller
    -ffunction-sections          ; GC unused functions
    -fdata-sections              ; GC unused data
    -Wl,--gc-sections            ; linker: remove unused code

lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14

; ------------------------------------------------------------
; Environment: ESP32 kedua (kaki kanan)
; ------------------------------------------------------------
; Sama persis dengan `esp32dev`, hanya DEVICE_ID-nya yang ditimpa supaya
; kedua board tidak menulis ke path Firebase yang sama. `esp32dev` tetap
; membaca DEVICE_ID dari include/config.h (git-ignored).
;
;   Kaki kiri  : pio run -e esp32dev        -t upload
;   Kaki kanan : pio run -e esp32_kanan     -t upload
;
; Pasangkan keduanya di dashboard: /users/<uid>/devices/insole-01 dan
; /users/<uid>/devices/insole-02.
[env:esp32_kanan]
extends = env:esp32dev
; Board kedua (v3.0, MAC 40:22:d8:6d:10:08) gagal di 460800 dengan
; "Unable to verify flash chip connection". 115200 jauh lebih toleran
; terhadap kabel/osilator yang marginal; board pertama tetap 460800.
upload_speed = 115200
build_flags =
    ${env:esp32dev.build_flags}
    -DDEVICE_ID_OVERRIDE=\"insole-02\"

; ------------------------------------------------------------
; Environment: Native test (unit test tanpa hardware)
; Run: pio test -e native
; ------------------------------------------------------------
; test_build_src=true so RandomForest.cpp (in src/) links into the test
; binary — without it the tests fail at link with undefined
; RandomForest::predict. build_src_filter then drops main.cpp, which
; needs Arduino.h and has no place on the host.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<RandomForest.cpp> -<main.cpp>
build_flags =
    -std=c++17
    -g                           ; debug symbols
